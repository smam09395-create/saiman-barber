# Netlify Configuration for SAIMAN Barber Shop & Grooming

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirect all SPA routes (e.g. /booking, /services, /barbers, /admin, /admin/dashboard)
# to index.html with HTTP 200 so direct URL refreshes never return 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers for production performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
